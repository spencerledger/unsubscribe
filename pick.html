<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the spencers.zone framework</title>
    <link rel="icon" type="image/x-icon" href="https://cdn.spencers.zone/images/triad-favicon.ico">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            color: #000000;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .logo {
            height: 40px;
            margin-right: 12px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 26px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 20px;
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            margin: 12px 0;
        }

        a {
            color: #0000ee;
            text-decoration: underline;
        }

        a:visited {
            color: #551a8b;
        }

        .log-link {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-brand">
            <img src="https://cdn.spencers.zone/images/triad-logo.png" alt="Logo" class="logo">
            <span class="brand-name">spencers.zone</span>
        </div>

        <h1>Temporarily Down for Maintenance</h1>
        <p>We are performing scheduled maintenance. You cannot currently choose your email preferences.</p>
        <p>To unsubscribe or submit a Do Not Contact Request, please email <a href="mailto:privacy@spencers.zone">privacy@spencers.zone</a> instead.</p>
        <p><a href="https://status.spencers.zone/maintenance/1123536" class="log-link">View maintenance log</a></p>
    </div>

</body>
</html>
